<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6f0"/>
      <stop offset="1" stop-color="#f3e8dc"/>
    </linearGradient>
    <marker id="down" markerWidth="12" markerHeight="12" refX="6" refY="9" orient="auto">
      <path d="M2,2 L6,9 L10,2" fill="none" stroke="#6f4e37" stroke-width="2"/>
    </marker>
    <marker id="up" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto">
      <path d="M2,10 L6,3 L10,10" fill="none" stroke="#2e7d32" stroke-width="2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="620" rx="16" fill="url(#bg)"/>
  <text x="430" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#3e2723">Coffee Bliss — Arsitektur MVVM + Repository</text>
  <text x="430" y="66" text-anchor="middle" font-size="13" fill="#7a6a5a">Aliran data satu arah • UI tidak pernah menyentuh database secara langsung</text>

  <!-- VIEW -->
  <rect x="120" y="92" width="620" height="92" rx="12" fill="#ffffff" stroke="#6f4e37" stroke-width="2"/>
  <text x="140" y="118" font-size="15" font-weight="700" fill="#6f4e37">VIEW — Jetpack Compose + Material 3</text>
  <text x="140" y="142" font-size="12" fill="#5a4a3a">Splash · Home · MemberCard · Transactions · AddTransaction · Reward · Profile · Members · AddMember</text>
  <text x="140" y="164" font-size="12" fill="#8a7a6a">Komponen: BottomBar · TierBadge · QrCodePlaceholder · Format — Navigation Compose mengatur rute</text>

  <!-- VIEWMODEL -->
  <rect x="120" y="232" width="620" height="78" rx="12" fill="#fff3e0" stroke="#c98a3a" stroke-width="2"/>
  <text x="140" y="258" font-size="15" font-weight="700" fill="#a6671f">VIEWMODEL — CoffeeBlissViewModel</text>
  <text x="140" y="282" font-size="12" fill="#5a4a3a">Memegang UI state (StateFlow) + logika layar</text>
  <text x="140" y="302" font-size="12" fill="#8a7a6a">addTransaction() menghitung poin · redeemReward() · registerMember() · setActiveMember()</text>

  <!-- REPOSITORY -->
  <rect x="120" y="358" width="620" height="58" rx="12" fill="#ffffff" stroke="#6f4e37" stroke-width="2"/>
  <text x="140" y="384" font-size="15" font-weight="700" fill="#6f4e37">REPOSITORY — CoffeeBlissRepository</text>
  <text x="140" y="404" font-size="12" fill="#8a7a6a">Single source of truth — satu-satunya pintu data yang dipanggil ViewModel</text>

  <!-- DAO -->
  <rect x="120" y="464" width="620" height="54" rx="12" fill="#ffffff" stroke="#6f4e37" stroke-width="2"/>
  <text x="140" y="488" font-size="15" font-weight="700" fill="#6f4e37">DAO — MemberDao · TransactionDao</text>
  <text x="140" y="508" font-size="12" fill="#8a7a6a">Query SQL (insert, update, observasi sebagai Flow)</text>

  <!-- ROOM -->
  <rect x="120" y="552" width="620" height="50" rx="12" fill="#efe7dd" stroke="#3e2723" stroke-width="2"/>
  <text x="140" y="576" font-size="15" font-weight="700" fill="#3e2723">MODEL — Room Database (SQLite)</text>
  <text x="140" y="595" font-size="12" fill="#5a4a3a">Tabel members · Tabel transactions — data tersimpan di perangkat</text>

  <!-- DOWN arrows (events) -->
  <line x1="300" y1="184" x2="300" y2="230" stroke="#6f4e37" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="300" y1="310" x2="300" y2="356" stroke="#6f4e37" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="300" y1="416" x2="300" y2="462" stroke="#6f4e37" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="300" y1="518" x2="300" y2="550" stroke="#6f4e37" stroke-width="2.5" marker-end="url(#down)"/>

  <!-- UP arrows (state) -->
  <line x1="560" y1="230" x2="560" y2="184" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="560" y1="356" x2="560" y2="310" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="560" y1="462" x2="560" y2="416" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#up)"/>
  <line x1="560" y1="550" x2="560" y2="518" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#up)"/>

  <text x="284" y="210" text-anchor="end" font-size="11" fill="#6f4e37" font-weight="600">aksi / event ↓</text>
  <text x="576" y="210" text-anchor="start" font-size="11" fill="#2e7d32" font-weight="600">↑ StateFlow (data)</text>
</svg>
